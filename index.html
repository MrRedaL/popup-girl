<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Example</title>
    <style>
        /* Basic Reset & Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #f4f4f9;
        }

        /* Trigger Button */
        .trigger-btn {
            background-color: #ff4757;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .trigger-btn:hover {
            background-color: #ff6b81;
        }

        /* Modal Background Overlay */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Content Box */
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Image Styling */
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Close Button */
        .close-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .close-btn:hover {
            background-color: #555;
        }

        /* Simple Fade Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- The Button -->
    <button class="trigger-btn" id="openModal">Click Me!</button>

    <!-- The Popup Modal -->
    <div class="modal-overlay" id="popupModal">
        <div class="modal-content">
            <!-- Replace the src URL with your desired image link -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Character">
            <h3>Hello there!</h3>
            <p>Here is the popup you requested.</p>
            <button class="close-btn" id="closeModal">Close</button>
        </div>
    </div>

    <script>
        const openModalBtn = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');
        const popupModal = document.getElementById('popupModal');

        // Open modal on click
        openModalBtn.addEventListener('click', () => {
            popupModal.style.display = 'flex';
        });

        // Close modal on close button click
        closeModalBtn.addEventListener('click', () => {
            popupModal.style.display = 'none';
        });

        // Close modal if user clicks outside the modal box
        popupModal.addEventListener('click', (e) => {
            if (e.target === popupModal) {
                popupModal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
